
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climate Forecast — Добавить</title>

    <link
        rel="stylesheet"
        href="/static/css/static.css"
    >
</head>

<body>

<div class="phone-screen light-screen">

    <header class="page-header">

        <div>

            <span class="page-label">
                CLIMATE FORECAST
            </span>

            <h1>
                Новый прогноз температуры
            </h1>

        </div>

        <span class="status-badge">
            Черновик
        </span>

    </header>


    <main class="add-content">

        <section class="form-section">

            <h2>
                Медиа
            </h2>

            <div class="upload-grid">

                <label class="upload-box">

                    <span class="upload-icon">
                        ＋
                    </span>

                    <span>
                        Добавить изображение
                    </span>

                    <input
                        class="file-input"
                        type="file"
                        accept="image/*"
                    >

                </label>


                <label class="upload-box">

                    <span class="upload-icon">
                        ▶
                    </span>

                    <span>
                        Добавить видео
                    </span>

                    <input
                        class="file-input"
                        type="file"
                        accept="video/*"
                    >

                </label>

            </div>

        </section>


        <section class="form-section">

            <h2>
                Информация
            </h2>


            <label class="field-label">
                Название
            </label>

            <input
                class="field-input"
                type="text"
                value="{{ prediction.title }}"
            >


            <label class="field-label">
                Описание
            </label>

            <textarea
                class="field-input field-textarea"
            >{{ prediction.description }}</textarea>

        </section>


        <section class="form-section">

            <h2>
                Концентрация газов
            </h2>

            <div class="gas-grid">

                <div>

                    <label class="field-label">
                        CO₂, ppm
                    </label>

                    <input
                        class="field-input"
                        type="number"
                        value="{{ prediction.co2_ppm }}"
                    >

                </div>


                <div>

                    <label class="field-label">
                        CH₄, ppb
                    </label>

                    <input
                        class="field-input"
                        type="number"
                        value="{{ prediction.ch4_ppb }}"
                    >

                </div>


                <div>

                    <label class="field-label">
                        N₂O, ppb
                    </label>

                    <input
                        class="field-input"
                        type="number"
                        value="{{ prediction.n2o_ppb }}"
                    >

                </div>

            </div>

        </section>


        <section class="result-card">

            <span class="result-label">
                ПРОГНОЗ ИЗМЕНЕНИЯ ТЕМПЕРАТУРЫ
            </span>

            <strong>
                +{{ "%.1f"|format(prediction.temperature_change_c) }} °C
            </strong>

        </section>
        <button type="button" class="add-button">
            Добавить
        </button>

    </main>


    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/forecast/1"
        >
            <span>▣</span>
            <span>Лента</span>
        </a>

        <a
            class="nav-item active"
            href="/forecast/draft"
        >
            <span>＋</span>
            <span>Добавить</span>
        </a>

        <a
            class="nav-item"
            href="/forecast/tile"
        >
            <span>▦</span>
            <span>Плитка</span>
        </a>

    </nav>

</div>

</body>
</html>
