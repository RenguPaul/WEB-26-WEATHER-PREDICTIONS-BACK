<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Forecast — Плитка</title>
    <link rel="stylesheet" href="/static/css/static.css">
</head>

<body>

<div class="phone-screen light-screen">

    <header class="page-header">
        <div>
            <span class="page-label">CLIMATE FORECAST</span>
            <h1>Плитка</h1>
        </div>
    </header>

    <main class="tile-content">

        <section class="filter-section">

            <h2>Климатические расчёты</h2>

            <form
                method="get"
                action="/forecast/tile"
                class="filter-form"
            >

                <div class="filter-input-wrapper">

                    <label for="co2">
                        ФИЛЬТР ПО CO₂
                    </label>

                    <div class="input-with-unit">

                        <input
                            id="co2"
                            type="number"
                            name="co2"
                            placeholder="Введите CO₂"
                            value="{{ co2_filter }}"
                        >

                        <span>ppm</span>

                    </div>

                </div>

                <button type="submit">
                    Найти
                </button>

            </form>

        </section>

        <section class="tile-grid">

            {% for prediction in predictions %}

            <a
                class="prediction-card"
                href="/forecast/{{ prediction.id }}"
            >

                <div class="prediction-image-wrapper">

                    <img
                        src="{{ prediction.image_url }}"
                        alt="{{ prediction.title }}"
                        class="prediction-image"
                    >

                    <span class="prediction-temperature">
                        +{{ "%.1f"|format(prediction.temperature_change_c) }} °C
                    </span>

                </div>

                <div class="prediction-card-content">

                    <h3>
                        {{ prediction.title }}
                    </h3>

                    <div class="prediction-likes">
                        <span>♥</span>
                        <span>{{ prediction.likes_count }}</span>
                    </div>

                </div>

            </a>

            {% endfor %}

        </section>

    </main>

    <nav class="bottom-nav">

        <a class="nav-item" href="/forecast/1">
            <span>▣</span>
            <span>Лента</span>
        </a>

        <a class="nav-item" href="/forecast/draft">
            <span>＋</span>
            <span>Добавить</span>
        </a>

        <a class="nav-item active" href="/forecast/tile">
            <span>▦</span>
            <span>Плитка</span>
        </a>

    </nav>

</div>

</body>
</html>
