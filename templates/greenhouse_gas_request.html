<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Заявка — Greenhouse Gases
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/static.css') }}"
    >

</head>


<body>

<div class="phone-screen">


    <!-- =====================================================
         ЗАГОЛОВОК
         ===================================================== -->

    <header class="page-header">

        <h1>
            Заявка
        </h1>

        <p>
            Расчёт изменения температуры
        </p>

    </header>


    <!-- =====================================================
         МЕДИА
         ===================================================== -->

    <section class="add-page">

        <h2>
            Медиафайлы
        </h2>


        <!-- Изображение-заглушка -->
        <div class="media-preview">

            <img
                src="{{ greenhouse_gas.image_url }}"
                alt="{{ greenhouse_gas.name }}"
            >

        </div>


        <label class="file-label">

            Изображение

            <input
                type="file"
                accept="image/*"
            >

        </label>


        <!-- Видео-заглушка -->
        <div class="media-preview">

            <video
                controls
                muted
                poster="{{ greenhouse_gas.image_url }}"
            >

                <source
                    src="{{ greenhouse_gas.video_url }}"
                    type="video/mp4"
                >

            </video>

        </div>


        <label class="file-label">

            Видео

            <input
                type="file"
                accept="video/*"
            >

        </label>


        <!-- =================================================
             ТЕКСТОВЫЕ ДАННЫЕ
             ================================================= -->

        <h2>
            Данные
        </h2>


        <div class="form-field">

            <label for="name">
                Название
            </label>

            <input
                id="name"
                type="text"
                value="{{ greenhouse_gas.name }}"
            >

        </div>


        <div class="form-field">

            <label for="formula">
                Формула
            </label>

            <input
                id="formula"
                type="text"
                value="{{ greenhouse_gas.formula }}"
            >

        </div>


        <div class="form-field">

            <label for="concentration">
                Концентрация, ppm
            </label>

            <input
                id="concentration"
                type="number"
                value="{{ greenhouse_gas.concentration_ppm }}"
                step="0.01"
            >

        </div>


        <div class="form-field">

            <label for="gwp">
                GWP100
            </label>

            <input
                id="gwp"
                type="number"
                value="{{ greenhouse_gas.global_warming_potential_100y }}"
                step="0.01"
            >

        </div>


        <div class="form-field">

            <label for="description">
                Описание
            </label>

            <textarea
                id="description"
                rows="5"
            >{{ greenhouse_gas.description }}</textarea>

        </div>


        <!-- =================================================
             РЕЗУЛЬТАТ
             ================================================= -->

        {% if greenhouse_gas.temperature_change is not none %}

        <div class="result-card">

            <h2>
                Результат расчёта
            </h2>

            <div class="result-temperature">

                +{{ greenhouse_gas.temperature_change }} °C

            </div>

            <p>
                Изменение средней температуры
                относительно базовой концентрации
                CO₂ — 280 ppm.
            </p>

        </div>

        {% endif %}


    </section>


    <!-- =====================================================
         НИЖНЯЯ НАВИГАЦИЯ
         ===================================================== -->

    <div class="bottom-nav">

        <a
            href="/greenhouse-gases/1"
            class="nav-item"
        >

            <span>
                ⌂
            </span>

            <span>
                Газ
            </span>

        </a>


        <a
            href="/greenhouse-gases/request"
            class="nav-item active"
        >

            <span>
                +
            </span>

            <span>
                Заявка
            </span>

        </a>


        <a
            href="/greenhouse-gases/catalog"
            class="nav-item"
        >

            <span>
                ▦
            </span>

            <span>
                Каталог
            </span>

        </a>

    </div>

</div>

</body>

</html>
